<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeXXen 1733 · Würfelbot</title>
<style>
  :root {
    --card: #1b1815;
    --border: #2b2723;
    --border2: #3a342c;
    --text: #f1eee9;
    --muted: #a8a29e;
    --faint: #78716c;
    --amber: #ffefcf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #26221c 0%, #12100e 55%, #0c0b09 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
  h1 { font-size: 1.55rem; font-weight: 900; letter-spacing: -0.02em; color: #fffbeb; margin: 0; }
  @media (min-width: 640px) { h1 { font-size: 1.9rem; } }
  .sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }
  .obrbadge {
    display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem;
    font-size: 0.72rem; color: #a7f3d0; background: rgba(6,78,59,.5);
    border: 1px solid #2f7d54; border-radius: 999px; padding: 0.25rem 0.7rem;
  }
  .obrbadge i { width: 0.5rem; height: 0.5rem; border-radius: 999px; background: #34d399; display: inline-block; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 0.75rem; font-size: 0.72rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 0.72rem; height: 0.72rem; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); display: inline-block; flex: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.1rem; margin-top: 1.1rem; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .cardlabel { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--faint); margin: 0 0 0.75rem; }
  .hr { height: 1px; background: var(--border); margin: 0.6rem 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.45rem 0; }
  .rowlabel { font-weight: 500; }
  .hint { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 0.5rem; flex: none; }
  .stepbtn { width: 2.6rem; height: 2.6rem; border-radius: 0.75rem; background: #2b2723; border: 1px solid #443d33; color: var(--text); font-size: 1.15rem; font-weight: 700; cursor: pointer; }
  .stepbtn:disabled { opacity: .3; cursor: default; }
  .stepbtn:active:not(:disabled) { transform: scale(.94); }
  .stepval { width: 2rem; text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--amber); font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .seg { height: 2.75rem; border-radius: 0.75rem; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border2); background: #221f1b; color: #cbd5e1; cursor: pointer; padding: 0 0.5rem; }
  .seg.active { background: #3a332a; border-color: rgba(253,230,138,.6); color: var(--amber); }
  .seg:disabled { opacity: .4; cursor: default; }
  .die {
    width: 4.2rem; height: 4.2rem; border-radius: 1rem; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0,0,0,.45);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.4), inset 0 3px 4px rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.45);
    animation: pop .3s ease;
  }
  @media (min-width: 640px) { .die { width: 4.75rem; height: 4.75rem; } }
  .die.light { border: 1px solid #a8a29e; box-shadow: inset 0 -4px 8px rgba(0,0,0,.12), inset 0 2px 3px rgba(255,255,255,.8), 0 4px 10px rgba(0,0,0,.4); }
  .die-inner { width: 74%; height: 74%; display: flex; align-items: center; justify-content: center; }
  .die-inner svg { width: 100%; height: 100%; display: block; }
  @keyframes pop { 0% { transform: scale(.55) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .rolling .die { animation: shuf .07s linear; }
  @keyframes shuf { 0% { transform: scale(.85) rotate(-6deg); } 100% { transform: scale(1) rotate(0); } }
  .dicerow-title { font-size: 0.85rem; font-weight: 600; color: #e2e8f0; }
  .dicerow-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .dices { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.55rem; }
  .total { font-size: 3.6rem; font-weight: 900; color: var(--amber); line-height: 1; font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
  .badge-ok { padding: 0.5rem 1rem; border-radius: 0.75rem; background: rgba(6,78,59,.6); border: 1px solid #2f7d54; color: #a7f3d0; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .badge-no { padding: 0.5rem 1rem; border-radius: 0.75rem; background: rgba(127,29,29,.6); border: 1px solid #991b1b; color: #fecaca; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .sumrow { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; color: var(--muted); }
  .sumrow b { color: var(--amber); font-variant-numeric: tabular-nums; }
  .btn-main { width: 100%; height: 3.4rem; border-radius: 1rem; border: 1px solid #052e16; background: linear-gradient(#256b3f, #17452a); color: #fff; font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
  .btn-main:active:not(:disabled) { transform: scale(.99); }
  .btn-main:disabled { opacity: .6; cursor: default; }
  .btn-sec { height: 3rem; border-radius: 1rem; background: #221f1b; border: 1px solid var(--border2); color: var(--text); font-weight: 600; cursor: pointer; width: 100%; }
  .btn-sec:active:not(:disabled) { transform: scale(.99); }
  .btn-sec:disabled { opacity: .5; cursor: default; }
  .empty { border: 1px dashed var(--border2); border-radius: 1rem; padding: 2rem; text-align: center; color: var(--faint); font-size: 0.85rem; margin-top: 1.1rem; }
  .note { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 0.9rem 1.1rem; font-size: 0.82rem; color: var(--muted); margin-top: 1.1rem; }
  .toggle { position: relative; width: 3rem; height: 1.7rem; border-radius: 999px; background: #475569; transition: background .2s; display: inline-block; border: none; padding: 0; cursor: pointer; flex: none; }
  .toggle.on { background: #059669; }
  .toggle i { position: absolute; top: 3px; left: 3px; width: 1.3rem; height: 1.3rem; border-radius: 999px; background: #fff; transition: left .2s; }
  .toggle.on i { left: calc(100% - 1.3rem - 3px); }
  .foot { text-align: center; font-size: 0.7rem; color: #57534e; margin-top: 1.1rem; }
</style>

// ---------- Regeldaten: Würfelseiten (offizielle W6-Simulation, Das Buch der Regeln S. 31) ----------
const HEXXEN_FACES = ["star", "blank", "blank", "blank", "success", "success"];
const HM_FACES = ["blank", "blank", "blank", "success", "success", "success"];
const JANUS_FACES = ["blank", "blank", "blank", "janus", "janus", "janus"];
const BLESS_FACES = ["star", "star", "blank", "success", "success", "success2"];
const BLUT_FACES = [0, 1, 1, 2, 2, 3];
const ELIXIR_FACES = [1, 2, 3, 4, 5, 3];

const BLOOD_ASSETS = { 1: P_BLOOD1, 2: P_BLOOD2, 3: P_BLOOD3 };
const ELIXIR_ASSETS = { 1: P_ELIXIR1, 2: P_ELIXIR2, 3: P_ELIXIR3, 4: P_ELIXIR4, 5: P_ELIXIR5 };
// Hexxenmeister-Symbol: vorläufig der Rabenkopf als Platzhalter, wird durch das Drachenkopf-Asset ersetzt
const P_HM_SUCCESS = P_SUCCESS;

const COLORS = { hexxen: "#1c5a34", janus: "#495057", blessing: "#f2efe6", blut: "#9e2b23", elixier: "#2a5490" };
const SYMBOL_LIGHT = "#f2efe6";
const SYMBOL_DARK = "#17140f";

const d6 = () => 1 + Math.floor(Math.random() * 6);
const nTimes = (n) => Array.from({ length: n }, () => d6());

// ---------- Zustand ----------
let S = {
  mode: "spieler", hexxen: 3, janus: 0, janusMode: "bonus",
  blutOn: false, elixierOn: false,
  roll: null, blessing: null, rolling: false, blessingRolling: false,
};
let OBR = null; // SDK-Objekt, wird per dynamischem Import vom CDN geladen
let OBRExtra = null; // SDK-Modul (enthält optional buildText/buildImage)
let obrState = "connecting"; // nosdk | connecting | ready | timeout
let sceneIds = [];

function randomRoll() {
  return {
    hexxen: nTimes(S.hexxen),
    janus: nTimes(S.janus),
    blut: S.blutOn ? d6() : null,
    elixier: S.elixierOn ? d6() : null,
    janusMode: S.janusMode,
    mode: S.mode,
  };
}

function rollAll() {
  if (S.rolling) return;
  S.blessing = null;
  S.rolling = true;
  render();
  const final = randomRoll();
  let n = 0;
  const iv = setInterval(() => {
    n += 1;
    S.roll = randomRoll();
    render();
    if (n >= 9) {
      clearInterval(iv);
      S.roll = final;
      S.rolling = false;
      render();
    }
  }, 70);
}

function rollBlessing() {
  if (!S.roll || S.roll.mode === "hm" || S.blessing || S.blessingRolling) return;
  S.blessingRolling = true;
  const final = d6();
  let n = 0;
  const iv = setInterval(() => {
    n += 1;
    S.blessing = { value: d6(), counted: true };
    render();
    if (n >= 9) {
      clearInterval(iv);
      S.blessing = { value: final, counted: true };
      S.blessingRolling = false;
      render();
    }
  }, 70);
}

function newProbe() {
  if (S.rolling) return;
  S.roll = null;
  S.blessing = null;
  render();
}

// ---------- Auswertung ----------
function evaluate() {
  const roll = S.roll;
  if (!roll) return null;
  const hf = roll.hexxen.map((v) => (roll.mode === "hm" ? HM_FACES[v - 1] : HEXXEN_FACES[v - 1]));
  const jf = roll.janus.map((v) => JANUS_FACES[v - 1]);
  let hexSuccesses = hf.filter((f) => f === "success").length;
  let stars = hf.filter((f) => f === "star").length;
  const janusSymbols = jf.filter((f) => f === "janus").length;
  const janusDelta = roll.janusMode === "bonus" ? janusSymbols : -janusSymbols;
  let blessingSuccesses = 0;
  if (S.blessing && S.blessing.counted) {
    const f = BLESS_FACES[S.blessing.value - 1];
    if (f === "success") blessingSuccesses = 1;
    else if (f === "success2") blessingSuccesses = 2;
    else if (f === "star") stars += 1;
  }
  const starBonus = Math.floor(stars / 2);
  const raw = hexSuccesses + starBonus + janusDelta + blessingSuccesses;
  return {
    hexSuccesses: hexSuccesses,
    stars: stars,
    starBonus: starBonus,
    janusSymbols: janusSymbols,
    janusDelta: janusDelta,
    blessingSuccesses: blessingSuccesses,
    total: Math.max(0, raw),
    capped: raw < 0,
    blutDrops: roll.blut !== null ? BLUT_FACES[roll.blut - 1] : null,
    elixirValue: roll.elixier !== null ? ELIXIR_FACES[roll.elixier - 1] : null,
  };
}

// ---------- Render-Bausteine ----------
function assetSvg(d, color) {
  return '<svg viewBox="0 0 709 709" xmlns="http://www.w3.org/2000/svg"><path d="' + d + '" fill="' + color + '"/></svg>';
}
function dieHtml(bg, light, inner) {
  return '<div class="die' + (light ? " light" : "") + '" style="background:' + bg + '"><div class="die-inner">' + (inner || "") + "</div></div>";
}
function esc(s) { return String(s); }

function stepper(label, hint, val, min, max, act, dis) {
  return '<div class="row"><div><div class="rowlabel">' + label + "</div><div class=\"hint\">" + hint + "</div></div>"
    + '<div class="stepper">'
    + '<button class="stepbtn" data-act="' + act + '-" ' + (dis || val <= min ? "disabled" : "") + ">−</button>"
    + '<span class="stepval">' + val + "</span>"
    + '<button class="stepbtn" data-act="' + act + '+" ' + (dis || val >= max ? "disabled" : "") + ">+</button>"
    + "</div></div>";
}
function chip(label, color, on, act, dis) {
  return '<button class="seg' + (on ? " active" : "") + '" data-act="' + act + '" ' + (dis ? "disabled" : "")
    + ' style="display:inline-flex;align-items:center;justify-content:center;gap:.5rem"><span class="swatch" style="background:' + color + '"></span>'
    + label + (on ? ' <span style="color:#6ee7b7;font-weight:800">✓</span>' : "") + "</button>";
}
function diceRow(title, sub, dice) {
  return '<div style="margin-bottom:1rem"><div class="dicerow-title">' + title + "</div>"
    + (sub ? '<div class="dicerow-sub">' + sub + "</div>" : "")
    + '<div class="dices">' + dice.join("") + "</div></div>";
}

function headerHtml() {
  const legend = [
    { c: COLORS.hexxen, n: "HeXXenwürfel" },
    { c: COLORS.janus, n: "Januswürfel" },
    { c: COLORS.blessing, n: "Segnungswürfel" },
    { c: COLORS.blut, n: "Blutwürfel" },
    { c: COLORS.elixier, n: "Elixierwürfel" },
  ];
  let h = "<h1>HeXXen 1733 · Würfelbot</h1>";
  h += '<div class="sub">Fertigkeitsproben mit HeXXen-, Janus- und Spezialwürfeln. Für PC und Smartphone.</div>';
  if (obrState === "ready") h += '<div class="obrbadge"><i></i>Mit Owlbear Rodeo verbunden</div>';
  else if (obrState === "timeout") h += '<div class="obrbadge" style="color:#fde68a;background:rgba(120,53,15,.45);border-color:#b45309"><i style="background:#f59e0b"></i>Keine Szene-Verbindung erkannt</div>';
  else if (obrState === "nosdk") h += '<div class="obrbadge" style="color:#fde68a;background:rgba(120,53,15,.45);border-color:#b45309"><i style="background:#f59e0b"></i>SDK nicht geladen (Adblocker?)</div>';
  h += '<div class="legend">' + legend.map((l) => '<span><span class="swatch" style="background:' + l.c + '"></span>' + l.n + "</span>").join("") + "</div>";
  return h;
}

function settingsHtml() {
  const dis = S.rolling;
  let h = '<section class="card"><div class="cardlabel">Würfel einstellen</div>';
  h += '<div class="grid2" style="margin-bottom:.5rem">'
    + '<button class="seg' + (S.mode === "spieler" ? " active" : "") + '" data-act="mode-spieler" ' + (dis ? "disabled" : "") + '>Spieler</button>'
    + '<button class="seg' + (S.mode === "hm" ? " active" : "") + '" data-act="mode-hm" ' + (dis ? "disabled" : "") + '>Hexxenmeister</button>'
    + "</div>";
  h += '<div class="hint" style="margin-bottom:.4rem">Spieler: 2 Erfolge, 1 Espritstern, 3 leer. Hexxenmeister: 3 Erfolge, 3 leer, kein Espritstern und kein Segnungswürfel.</div>';
  h += '<div class="hr"></div>';
  h += stepper("HeXXenwürfel", "2 bis 10 Würfel pro Probe", S.hexxen, 2, 10, "hx", dis);
  h += '<div class="hr"></div>';
  h += stepper("Januswürfel", "0 bis 5 Würfel, entsprechend Bonus oder Malus", S.janus, 0, 5, "jn", dis);
  h += '<div class="grid2" style="margin-top:.5rem">'
    + '<button class="seg' + (S.janusMode === "bonus" ? " active" : "") + '" data-act="jbonus" ' + (dis ? "disabled" : "") + '>Bonus (+ Erfolge)</button>'
    + '<button class="seg' + (S.janusMode === "malus" ? " active" : "") + '" data-act="jmalus" ' + (dis ? "disabled" : "") + '>Malus (− Erfolge)</button>'
    + "</div>";
  h += '<div class="hr"></div>';
  h += '<div class="rowlabel" style="padding:.4rem 0 .2rem">Spezialwürfel</div>';
  h += '<div class="hint" style="margin-bottom:.5rem">Blut- und Elixierwürfel können einzeln oder gemeinsam gewürfelt werden.</div>';
  h += '<div class="grid2">'
    + chip("Blutwürfel", COLORS.blut, S.blutOn, "blut", dis)
    + chip("Elixierwürfel", COLORS.elixier, S.elixierOn, "elixier", dis)
    + "</div>";
  h += '<button class="btn-main" style="margin-top:1rem" data-act="roll" ' + (dis ? "disabled" : "") + ">" + (S.rolling ? "Würfelt …" : "Würfeln") + "</button>";
  h += "</section>";
  return h;
}

function resultHtml(ev) {
  if (!S.roll) {
    return '<div class="empty">Anzahl der Würfel einstellen und würfeln. Leere Würfelseiten bleiben blank.</div>';
  }
  const roll = S.roll;
  const sym = roll.mode === "hm" ? P_HM_SUCCESS : P_SUCCESS;
  const hexxenDice = roll.hexxen.map((v) => {
    const f = roll.mode === "hm" ? HM_FACES[v - 1] : HEXXEN_FACES[v - 1];
    const inner = f === "star" ? assetSvg(P_STAR, SYMBOL_LIGHT) : f === "success" ? assetSvg(sym, SYMBOL_LIGHT) : "";
    return dieHtml(COLORS.hexxen, false, inner);
  });
  const janusDice = roll.janus.map((v) => {
    const f = JANUS_FACES[v - 1];
    return dieHtml(COLORS.janus, false, f === "janus" ? assetSvg(P_JANUS, SYMBOL_LIGHT) : "");
  });
  const blutDice = roll.blut !== null && BLUT_FACES[roll.blut - 1] > 0
    ? [dieHtml(COLORS.blut, false, assetSvg(BLOOD_ASSETS[BLUT_FACES[roll.blut - 1]], SYMBOL_LIGHT))]
    : roll.blut !== null ? [dieHtml(COLORS.blut, false, "")] : [];
  const elixierDice = roll.elixier !== null
    ? [dieHtml(COLORS.elixier, false, assetSvg(ELIXIR_ASSETS[ELIXIR_FACES[roll.elixier - 1]], SYMBOL_LIGHT))]
    : [];

  let h = '<section class="card"><div class="cardlabel">Gewürfelt</div>';
  h += diceRow(
    (roll.mode === "hm" ? "HeXXenwürfel des Hexxenmeisters (" : "HeXXenwürfel (") + roll.hexxen.length + ")",
    roll.mode === "hm" ? "3 Seiten Erfolg · 3 leer · kein Espritstern" : "2 Seiten Erfolg · 1 Espritstern · 3 leer",
    hexxenDice
  );
  if (janusDice.length > 0) {
    h += diceRow("Januswürfel (" + roll.janus.length + ")",
      roll.janusMode === "bonus" ? "Bonus: Symbole zählen als Erfolge" : "Malus: Symbole ziehen Erfolge ab", janusDice);
  }
  if (roll.blut !== null) h += diceRow("Blutwürfel", "Blutstropfen = Stärke des Effekts", blutDice);
  if (roll.elixier !== null) h += diceRow("Elixierwürfel", "Ziffer = Wirksamkeit des Elixiers", elixierDice);
  h += "</section>";

  // Segnungswürfel
  if (roll.mode !== "hm") {
    h += '<section class="card"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem">';
    h += '<div><div class="cardlabel" style="margin-bottom:.2rem">Segnungswürfel</div>'
      + '<div style="font-size:.82rem;color:#cbd5e1">Nachwürfeln kostet 1 Segnung. Maximal 1 Segnungswürfel pro Probe.</div></div>';
    if (!S.blessing) {
      h += '<button class="btn-sec" style="width:auto;height:2.75rem;padding:0 1.2rem" data-act="bless" '
        + (S.rolling || S.blessingRolling ? "disabled" : "") + ">Nachwürfeln</button>";
    } else {
      const f = BLESS_FACES[S.blessing.value - 1];
      const inner = f === "star" ? assetSvg(P_STAR, SYMBOL_DARK)
        : f === "success" ? assetSvg(P_SUCCESS, SYMBOL_DARK)
        : f === "success2" ? assetSvg(P_SUCCESS2, SYMBOL_DARK) : "";
      h += '<div style="display:flex;align-items:center;gap:1rem">' + dieHtml(COLORS.blessing, true, inner);
      h += '<button class="toggle' + (S.blessing.counted ? " on" : "") + '" data-act="blesscount" aria-label="Zum Ergebnis zählen"><i></i></button>';
      h += '<div><div class="hint">Zum Ergebnis zählen</div></div></div>';
    }
    h += "</div></section>";
  } else {
    h += '<div class="note">Als Hexxenmeister ist kein Segnungswürfel verfügbar. Segnungen werden ausschließlich von Spielern verwendet.</div>';
  }

  // Endergebnis
  h += '<section class="card"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem">';
  h += '<div><div class="cardlabel">Endergebnis</div><div class="total">' + ev.total + '</div><div style="font-size:.82rem;color:var(--muted);margin-top:.2rem">Erfolge</div></div>';
  h += ev.total >= 1 ? '<span class="badge-ok">Einfache Probe bestanden</span>' : '<span class="badge-no">Misserfolg</span>';
  h += "</div>";
  h += '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:grid;gap:.4rem">';
  h += '<div class="sumrow"><span>HeXXen-Erfolge</span><b>' + ev.hexSuccesses + "</b></div>";
  if (ev.stars > 0) h += '<div class="sumrow"><span>Espritsterne: ' + ev.stars + " (je 2 = +1 Erfolg)</span><b>+" + ev.starBonus + "</b></div>";
  if (roll.janus.length > 0) h += '<div class="sumrow"><span>Janussymbole: ' + ev.janusSymbols + " (" + (roll.janusMode === "bonus" ? "Bonus" : "Malus") + ")</span><b>" + (ev.janusDelta >= 0 ? "+" : "") + ev.janusDelta + "</b></div>";
  if (S.blessing && S.blessing.counted && ev.blessingSuccesses > 0) h += '<div class="sumrow"><span>Segnungswürfel</span><b>+' + ev.blessingSuccesses + "</b></div>";
  if (ev.blutDrops !== null) h += '<div class="sumrow"><span>Blutwürfel</span><b>' + ev.blutDrops + " Blutstropfen</b></div>";
  if (ev.elixirValue !== null) h += '<div class="sumrow"><span>Elixierwürfel</span><b>Wirksamkeit ' + ev.elixirValue + "</b></div>";
  h += "</div>";
  if (ev.capped) h += '<p class="hint" style="margin-top:.75rem">Der Malus hätte das Ergebnis unter 0 gesenkt. Die Erfolge können höchstens auf 0 sinken.</p>';
  if (ev.stars > 0) h += '<p class="hint" style="margin-top:.4rem">Espritsterne können stattdessen für Espritkräfte eingesetzt werden, dann entfällt ihr Erfolgsbonus.</p>';
  h += "</section>";

  if (obrState === "ready" || obrState === "timeout") {
    h += '<div class="grid2" style="margin-top:1.1rem">'
      + '<button class="btn-sec" data-act="scene">Auf die Szene würfeln</button>'
      + '<button class="btn-sec" data-act="cleanup" ' + (sceneIds.length > 0 ? "" : "disabled") + '>Würfel entfernen</button></div>';
    h += '<button class="btn-sec" style="margin-top:.5rem" data-act="new" ' + (S.rolling ? "disabled" : "") + '>Neue Probe</button>';
  } else {
    h += '<button class="btn-sec" style="margin-top:1.1rem" data-act="new" ' + (S.rolling ? "disabled" : "") + ">Neue Probe</button>";
  }
  return h;
}

function render() {
  const app = document.getElementById("app");
  app.className = "wrap" + (S.rolling || S.blessingRolling ? " rolling" : "");
  const ev = evaluate();
  let h = headerHtml() + settingsHtml() + resultHtml(ev);
  h += '<p class="foot">Würfelseiten nach offizieller W6-Simulationstabelle (Das Buch der Regeln, S. 31).</p>';
  app.innerHTML = h;
}

// ---------- Szene-Teilen (Owlbear Rodeo) ----------
function shareText(ev) {
  const r = S.roll;
  const lines = [];
  lines.push("HeXXen 1733 · Probe (" + (r.mode === "hm" ? "Hexxenmeister" : "Spieler") + ")");
  lines.push("HeXXenwürfel: " + ev.hexSuccesses + " Erfolg(e)" + (ev.stars > 0 ? ", " + ev.stars + " Espritstern(e)" : ""));
  if (r.janus.length > 0) lines.push("Janus: " + ev.janusSymbols + " Symbol(e), " + (r.janusMode === "bonus" ? "Bonus" : "Malus") + " (" + (ev.janusDelta >= 0 ? "+" : "") + ev.janusDelta + ")");
  if (ev.stars > 0) lines.push("Espritsterne: je 2 = +1 Erfolg (+" + ev.starBonus + ")");
  if (S.blessing && S.blessing.counted && ev.blessingSuccesses > 0) lines.push("Segnungswürfel: +" + ev.blessingSuccesses);
  if (ev.blutDrops !== null) lines.push("Blutwürfel: " + ev.blutDrops + " Blutstropfen");
  if (ev.elixirValue !== null) lines.push("Elixierwürfel: Wirksamkeit " + ev.elixirValue);
  lines.push("Erfolge gesamt: " + ev.total + (ev.total >= 1 ? " (einfache Probe bestanden)" : " (Misserfolg)"));
  return lines.join("\n");
}

function rawTextItem(text) {
  const id = (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : "wurf-" + Date.now() + "-" + Math.floor(Math.random() * 1e9);
  return {
    id: id,
    type: "TEXT",
    visible: true,
    locked: false,
    name: "HeXXen-Wurf",
    x: 0,
    y: 0,
    rotation: 0,
    scale: { x: 1, y: 1 },
    text: {
      type: "PLAIN",
      plainText: text,
      richText: [{ type: "paragraph", children: [{ text: text }] }],
      style: {
        fillColor: "#f5f0e6", fillOpacity: 1,
        strokeColor: "#000000", strokeOpacity: 0, strokeWidth: 0,
        textAlign: "CENTER", textAlignVertical: "MIDDLE",
        fontFamily: "openSans", fontSize: 28, fontWeight: 400, lineHeight: 1.2,
      },
      width: "auto",
      height: "auto",
    },
    width: "auto",
    height: "auto",
  };
}

function copyResult(text) {
  const done = () => {
    if (OBR && OBR.notification) OBR.notification.show("Ergebnis kopiert – bitte manuell einfügen.");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => alert(text));
    } else {
      alert(text);
    }
  } catch (e) {
    alert(text);
  }
}

// ---------- Würfel auf die Szene legen ----------
function diceListForScene() {
  const roll = S.roll;
  if (!roll) return [];
  const files = [];
  roll.hexxen.forEach(function (v) {
    const f = roll.mode === "hm" ? HM_FACES[v - 1] : HEXXEN_FACES[v - 1];
    files.push(f === "star" ? "wuerfel-hexxen-stern.svg" : f === "success" ? "wuerfel-hexxen-erfolg.svg" : "wuerfel-hexxen-blank.svg");
  });
  roll.janus.forEach(function (v) {
    const f = JANUS_FACES[v - 1];
    files.push(f === "janus" ? "wuerfel-janus-symbol.svg" : "wuerfel-janus-blank.svg");
  });
  if (roll.blut !== null) {
    const dr = BLUT_FACES[roll.blut - 1];
    files.push(dr === 0 ? "wuerfel-blut-blank.svg" : "wuerfel-blut-" + dr + ".svg");
  }
  if (roll.elixier !== null) {
    files.push("wuerfel-elixier-" + ELIXIR_FACES[roll.elixier - 1] + ".svg");
  }
  if (S.blessing) {
    const f = BLESS_FACES[S.blessing.value - 1];
    files.push(f === "star" ? "wuerfel-segnung-stern.svg" : f === "success" ? "wuerfel-segnung-erfolg.svg" : f === "success2" ? "wuerfel-segnung-erfolg2.svg" : "wuerfel-segnung-blank.svg");
  }
  return files;
}

function makeDieImage(url, x, y, rot) {
  const id = (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : "wuerfel-" + Date.now() + "-" + Math.floor(Math.random() * 1e9);
  return {
    id: id,
    type: "IMAGE",
    visible: true,
    locked: false,
    name: "HeXXen-Würfel",
    x: x,
    y: y,
    rotation: rot,
    scale: { x: 1, y: 1 },
    image: { url: url, mime: "image/svg+xml", width: 256, height: 256 },
    grid: { dpi: 256, offset: [{ x: 128, y: 128 }] },
    text: {
      type: "PLAIN",
      plainText: "",
      richText: [],
      style: {
        fillColor: "#000000", fillOpacity: 1,
        strokeColor: "#000000", strokeOpacity: 0, strokeWidth: 0,
        textAlign: "LEFT", textAlignVertical: "TOP",
        fontFamily: "openSans", fontSize: 24, fontWeight: 400, lineHeight: 1.25,
      },
      width: "auto",
      height: "auto",
    },
    textItemType: "LABEL",
  };
}

function getBuilder(name) {
  if (OBRExtra && typeof OBRExtra[name] === "function") return OBRExtra[name];
  if (OBR && typeof OBR[name] === "function") return OBR[name];
  return null;
}

function dieItem(url, x, y, rot) {
  const buildImage = getBuilder("buildImage");
  if (buildImage) {
    try {
      return buildImage(
        { height: 256, width: 256, url: url, mime: "image/svg+xml" },
        { dpi: 256, offset: { x: 128, y: 128 } }
      ).x(x).y(y).rotation(rot).name("HeXXen-Würfel").locked(false).build();
    } catch (e) { /* Fallback: rohes Objekt unten */ }
  }
  return makeDieImage(url, x, y, rot);
}

function resultTextItem(x, y, text) {
  const buildText = getBuilder("buildText");
  if (buildText) {
    try {
      let b = buildText();
      if (typeof b.plainText === "function") b = b.plainText(text);
      if (typeof b.textType === "function") b = b.textType("PLAIN");
      if (typeof b.fontSize === "function") b = b.fontSize(40);
      if (typeof b.fillColor === "function") b = b.fillColor("#f5f0e6");
      if (typeof b.textAlign === "function") b = b.textAlign("CENTER");
      if (typeof b.width === "function") b = b.width("auto");
      if (typeof b.height === "function") b = b.height("auto");
      return b.x(x).y(y).name("HeXXen-Wurf").build();
    } catch (e) { /* Fallback: rohes Objekt unten */ }
  }
  const t = rawTextItem(text);
  t.x = x;
  t.y = y;
  return t;
}

async function placeOnScene() {
  const ev = evaluate();
  if (!ev || !OBR) return;
  const files = diceListForScene();
  const base = location.href.replace(/[^/]*$/, "");
  let cell = 100;
  try { const g = await OBR.scene.getGrid(); if (g && typeof g.size === "number" && g.size > 0) cell = g.size; } catch (e) {}
  let cx = 0, cy = 0;
  try {
    const vp = await OBR.viewport.getViewport();
    const sc = (vp && vp.scale) ? vp.scale : 1;
    if (vp && vp.topLeft) { cx = vp.topLeft.x + (vp.width / sc) / 2; cy = vp.topLeft.y + (vp.height / sc) / 2; }
  } catch (e) {}
  const perRow = Math.min(6, files.length);
  const rows = Math.ceil(files.length / perRow);
  const gap = cell * 1.1;
  const items = [];
  files.forEach(function (fn, i) {
    const col = i % perRow;
    const row = Math.floor(i / perRow);
    const px = cx - ((perRow - 1) / 2) * gap + col * gap;
    const py = cy - ((rows - 1) / 2) * gap + row * gap;
    items.push(dieItem(base + fn, px, py, Math.random() * 16 - 8));
  });
  items.push(resultTextItem(cx, cy + ((rows - 1) / 2) * gap + gap, shareText(ev)));
  try {
    await OBR.scene.items.addItems(items);
    sceneIds = items.map(function (it) { return it.id; });
    OBR.notification.show("Wurf auf die Szene gelegt.");
  } catch (err) {
    try {
      await OBR.scene.items.addItems([text]);
      sceneIds = [text.id];
      OBR.notification.show("Würfelbilder nicht erreichbar, Ergebnis als Text gelegt.");
    } catch (e2) {
      copyResult(shareText(ev));
    }
  }
  render();
}

async function cleanupScene() {
  if (!OBR || sceneIds.length === 0) return;
  try {
    await OBR.scene.items.deleteItems(sceneIds);
    sceneIds = [];
    OBR.notification.show("Würfel von der Szene entfernt.");
  } catch (e) {
    OBR.notification.show("Entfernen nicht möglich.");
  }
  render();
}

// ---------- Ereignisse ----------
document.getElementById("app").addEventListener("click", function (e) {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.getAttribute("data-act");
  if (a === "mode-spieler") { S.mode = "spieler"; render(); }
  else if (a === "mode-hm") { S.mode = "hm"; render(); }
  else if (a === "hx-") { S.hexxen = Math.max(2, S.hexxen - 1); render(); }
  else if (a === "hx+") { S.hexxen = Math.min(10, S.hexxen + 1); render(); }
  else if (a === "jn-") { S.janus = Math.max(0, S.janus - 1); render(); }
  else if (a === "jn+") { S.janus = Math.min(5, S.janus + 1); render(); }
  else if (a === "jbonus") { S.janusMode = "bonus"; render(); }
  else if (a === "jmalus") { S.janusMode = "malus"; render(); }
  else if (a === "blut") { S.blutOn = !S.blutOn; render(); }
  else if (a === "elixier") { S.elixierOn = !S.elixierOn; render(); }
  else if (a === "roll") { rollAll(); }
  else if (a === "bless") { rollBlessing(); }
  else if (a === "blesscount") { if (S.blessing) { S.blessing.counted = !S.blessing.counted; render(); } }
  else if (a === "new") { newProbe(); }
  else if (a === "scene") { placeOnScene(); }
  else if (a === "cleanup") { cleanupScene(); }
});

// ---------- Start ----------
render();
async function initOBR() {
  const cdns = [
    "https://esm.sh/@owlbear-rodeo/sdk@3.1.0",
    "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm"
  ];
  for (let i = 0; i < cdns.length; i++) {
    try {
      const mod = await import(cdns[i]);
      const obr = mod.default || mod;
      if (obr && typeof obr.onReady === "function") { OBR = obr; OBRExtra = mod; break; }
    } catch (e) { /* nächsten CDN versuchen */ }
  }
  if (!OBR) { obrState = "nosdk"; render(); return; }
  try {
    OBR.onReady(function () { obrState = "ready"; render(); });
  } catch (e) {
    obrState = "timeout";
  }
  setTimeout(function () {
    if (obrState === "connecting") { obrState = "timeout"; render(); }
  }, 3000);
  render();
}
initOBR();
</script>
